[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellvault"
version = "0.1.0"
description = "Reproducibility-oriented data system for single-cell analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10",
    "duckdb>=1.0",
    "zarr>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
scanpy = ["scanpy[leiden]>=1.10"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellvault"]
